<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Line (-10 to 10)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .board {
      background: #1e293b;
      width: 100%;
      max-width: 1050px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Top Header: Progress Bar + Equation Visual */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .progress-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 340px;
    }

    .progress-wrapper.active {
      display: flex;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .equation-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .q-badge {
      display: none;
      background: #38bdf8;
      color: #0f172a;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .q-badge.active {
      display: inline-block;
    }

    .equation-pill {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 10px 28px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      justify-content: center;
      transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
    }

    /* Solved state before switching question */
    .equation-pill.solved {
      border-color: #22c55e;
      background-color: rgba(34, 197, 94, 0.12);
    }

    /* Animation when a new question arrives */
    @keyframes newQuestionFlash {
      0% {
        transform: translateY(-10px) scale(0.95);
        border-color: #38bdf8;
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
      }
      50% {
        transform: translateY(0) scale(1.04);
        border-color: #38bdf8;
        box-shadow: 0 0 20px 4px rgba(56, 189, 248, 0.35);
      }
      100% {
        transform: translateY(0) scale(1);
        border-color: #334155;
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
      }
    }

    .equation-pill.new-question {
      animation: newQuestionFlash 0.65s ease-out;
    }

    .eq-start {
      color: #38bdf8;
    }

    .eq-op {
      color: #94a3b8;
    }

    .eq-jump {
      color: #fb923c;
    }

    .eq-mystery {
      color: #64748b;
    }

    .eq-correct-ans {
      color: #4ade80;
    }

    /* SVG Number Line */
    svg {
      width: 100%;
      height: auto;
      max-height: 240px;
      overflow: visible;
      touch-action: none;
    }

    .tick-label {
      font-size: 16px;
      font-weight: 600;
      fill: #94a3b8;
    }

    .tick-label.zero {
      font-size: 18px;
      font-weight: 800;
      fill: #f8fafc;
    }

    .draggable-group {
      cursor: grab;
      transition: filter 0.15s ease;
    }

    .draggable-group:hover {
      filter: brightness(1.12);
    }

    .draggable-group.dragging {
      cursor: grabbing;
    }

    .handle-label {
      font-size: 13px;
      font-weight: 800;
      fill: #0f172a;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* Bottom Controls */
    .bottom-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 44px;
    }

    .practice-controls {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .practice-controls.active {
      display: flex;
    }

    .answer-input {
      width: 96px;
      padding: 9px 12px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      background: #0f172a;
      border: 1.5px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      transition: border-color 0.15s ease;
    }

    .answer-input:focus {
      border-color: #38bdf8;
    }

    .answer-input::-webkit-outer-spin-button,
    .answer-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .answer-input[type=number] {
      -moz-appearance: textfield;
    }

    .btn {
      background-color: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background-color: #475569;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-subtle {
      background-color: transparent;
      color: #94a3b8;
      border-color: #334155;
    }

    .btn-subtle:hover {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .feedback-msg {
      font-size: 14px;
      font-weight: 700;
      min-width: 115px;
      text-align: left;
    }

    .feedback-msg.correct {
      color: #4ade80;
    }

    .feedback-msg.wrong {
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="board">
    <!-- Top Equation & Practice Progress -->
    <div class="top-bar">
      <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-label" id="progressLabel">Question 1 of 10</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="equation-container">
        <span class="q-badge" id="qBadge">Q1</span>
        <div class="equation-pill" id="equationPill">
          <span class="eq-start">0</span>
          <span class="eq-op">+</span>
          <span class="eq-jump">0</span>
          <span class="eq-op">=</span>
          <span class="eq-mystery">?</span>
        </div>
      </div>
    </div>

    <!-- Interactive Number Line -->
    <svg id="numberLine" viewBox="0 0 1000 230">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
        </filter>
      </defs>

      <!-- Static Axis & Ticks -->
      <g id="axisLayer"></g>

      <!-- Hopping Dashed Line Layer -->
      <path id="hopPath" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="5,5" stroke-linecap="round" />

      <!-- END Marker (Orange) -->
      <g id="endMarker" class="draggable-group" filter="url(#shadow)">
        <line x1="0" y1="120" x2="0" y2="180" stroke="#fb923c" stroke-width="2.5" />
        <rect x="-28" y="176" width="56" height="26" rx="6" fill="#fb923c" />
        <text x="0" y="193" text-anchor="middle" class="handle-label">End</text>
        <circle id="endDot" cx="0" cy="120" r="11" fill="#fb923c" stroke="#0f172a" stroke-width="3" />
      </g>

      <!-- START Marker (Blue) -->
      <g id="startMarker" class="draggable-group" filter="url(#shadow)">
        <line x1="0" y1="120" x2="0" y2="42" stroke="#38bdf8" stroke-width="2.5" />
        <rect x="-32" y="16" width="64" height="26" rx="6" fill="#38bdf8" />
        <text x="0" y="33" text-anchor="middle" class="handle-label">Start</text>
        <circle id="startDot" cx="0" cy="120" r="11" fill="#38bdf8" stroke="#0f172a" stroke-width="3" />
      </g>
    </svg>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button class="btn" id="resetBtn">Reset Dots</button>
      <button class="btn" id="startPracticeBtn">Practice</button>

      <div class="practice-controls" id="practiceControls">
        <input type="number" id="answerInput" class="answer-input" placeholder="Answer" />
        <button class="btn btn-primary" id="checkBtn">Check</button>
        <span class="feedback-msg" id="feedbackMsg"></span>
        <button class="btn btn-subtle" id="exitPracticeBtn">Exit Practice</button>
      </div>
    </div>
  </div>

  <script>
    const MIN = -10;
    const MAX = 10;
    const START_X = 60;
    const END_X = 940;
    const LINE_Y = 120;
    const STEP = (END_X - START_X) / (MAX - MIN);
    const TOTAL_QUESTIONS = 10;

    const svg = document.getElementById('numberLine');
    const axisLayer = document.getElementById('axisLayer');
    const hopPath = document.getElementById('hopPath');
    const startMarker = document.getElementById('startMarker');
    const endMarker = document.getElementById('endMarker');
    const equationPill = document.getElementById('equationPill');
    const qBadge = document.getElementById('qBadge');

    const resetBtn = document.getElementById('resetBtn');
    const startPracticeBtn = document.getElementById('startPracticeBtn');
    const practiceControls = document.getElementById('practiceControls');
    const progressWrapper = document.getElementById('progressWrapper');
    const progressLabel = document.getElementById('progressLabel');
    const progressFill = document.getElementById('progressFill');
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const exitPracticeBtn = document.getElementById('exitPracticeBtn');

    let startVal = 0;
    let endVal = 0;
    let endDetached = false; // End stays locked to Start until End is dragged
    let activeMarker = null;

    // Practice state
    let isPracticeMode = false;
    let questions = [];
    let currentQuestionIndex = 0;
    let isTransitioning = false;

    function valToX(val) {
      return START_X + (val - MIN) * STEP;
    }

    function xToVal(x) {
      const raw = MIN + (x - START_X) / STEP;
      return Math.max(MIN, Math.min(MAX, Math.round(raw)));
    }

    function drawAxis() {
      const axisLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      axisLine.setAttribute('x1', START_X - 30);
      axisLine.setAttribute('y1', LINE_Y);
      axisLine.setAttribute('x2', END_X + 30);
      axisLine.setAttribute('y2', LINE_Y);
      axisLine.setAttribute('stroke', '#64748b');
      axisLine.setAttribute('stroke-width', '3');
      axisLine.setAttribute('stroke-linecap', 'round');
      axisLayer.appendChild(axisLine);

      const leftArrow = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      leftArrow.setAttribute('points', `${START_X - 20},${LINE_Y - 7} ${START_X - 32},${LINE_Y} ${START_X - 20},${LINE_Y + 7}`);
      leftArrow.setAttribute('fill', 'none');
      leftArrow.setAttribute('stroke', '#64748b');
      leftArrow.setAttribute('stroke-width', '3');
      leftArrow.setAttribute('stroke-linecap', 'round');
      leftArrow.setAttribute('stroke-linejoin', 'round');
      axisLayer.appendChild(leftArrow);

      const rightArrow = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      rightArrow.setAttribute('points', `${END_X + 20},${LINE_Y - 7} ${END_X + 32},${LINE_Y} ${END_X + 20},${LINE_Y + 7}`);
      rightArrow.setAttribute('fill', 'none');
      rightArrow.setAttribute('stroke', '#64748b');
      rightArrow.setAttribute('stroke-width', '3');
      rightArrow.setAttribute('stroke-linecap', 'round');
      rightArrow.setAttribute('stroke-linejoin', 'round');
      axisLayer.appendChild(rightArrow);

      for (let i = MIN; i <= MAX; i++) {
        const x = valToX(i);
        const isZero = i === 0;

        const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        tick.setAttribute('x1', x);
        tick.setAttribute('x2', x);
        tick.setAttribute('y1', isZero ? LINE_Y - 16 : LINE_Y - 10);
        tick.setAttribute('y2', isZero ? LINE_Y + 16 : LINE_Y + 10);
        tick.setAttribute('stroke', isZero ? '#f8fafc' : '#475569');
        tick.setAttribute('stroke-width', isZero ? '3.5' : '2');
        tick.setAttribute('stroke-linecap', 'round');
        axisLayer.appendChild(tick);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', x);
        label.setAttribute('y', LINE_Y + 42);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('class', isZero ? 'tick-label zero' : 'tick-label');
        label.textContent = i;
        axisLayer.appendChild(label);
      }
    }

    function renderEquation(start, diff, revealedAnswer = null) {
      const op = diff >= 0 ? '+' : '−';
      const absJump = Math.abs(diff);
      const rhs = revealedAnswer !== null
        ? `<span class="eq-correct-ans">${revealedAnswer} ✓</span>`
        : `<span class="eq-mystery">?</span>`;

      equationPill.innerHTML = `
        <span class="eq-start">${start}</span>
        <span class="eq-op">${op}</span>
        <span class="eq-jump">${absJump}</span>
        <span class="eq-op">=</span>
        ${rhs}
      `;
    }

    function triggerNewQuestionAnimation() {
      equationPill.classList.remove('solved', 'new-question');
      void equationPill.offsetWidth; // Force reflow so animation restarts cleanly
      equationPill.classList.add('new-question');
    }

    function updateHops() {
      if (startVal === endVal) {
        hopPath.setAttribute('d', '');
        return;
      }

      const dir = endVal > startVal ? 1 : -1;
      let d = '';
      for (let v = startVal; v !== endVal; v += dir) {
        const x1 = valToX(v);
        const x2 = valToX(v + dir);
        const midX = (x1 + x2) / 2;
        const peakY = LINE_Y - 38;
        d += `M ${x1} ${LINE_Y} Q ${midX} ${peakY} ${x2} ${LINE_Y} `;
      }
      hopPath.setAttribute('d', d.trim());
    }

    function updatePositions() {
      const startX = valToX(startVal);
      const endX = valToX(endVal);

      startMarker.setAttribute('transform', `translate(${startX}, 0)`);
      endMarker.setAttribute('transform', `translate(${endX}, 0)`);

      const endDot = document.getElementById('endDot');
      endDot.setAttribute('r', startVal === endVal ? '15' : '11');

      updateHops();

      if (!isPracticeMode) {
        renderEquation(startVal, endVal - startVal);
      }
    }

    function resetDots() {
      startVal = 0;
      endVal = 0;
      endDetached = false;
      updatePositions();
    }

    function getSVGX(evt) {
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
    }

    function startDrag(markerType, evt) {
      evt.preventDefault();
      activeMarker = markerType;
      const el = markerType === 'start' ? startMarker : endMarker;
      el.classList.add('dragging');
      el.setPointerCapture(evt.pointerId);
    }

    function onDrag(evt) {
      if (!activeMarker) return;
      const svgX = getSVGX(evt);
      const snappedVal = xToVal(svgX);

      if (activeMarker === 'start' && snappedVal !== startVal) {
        startVal = snappedVal;
        // Keep End stuck to Start until End has been moved manually
        if (!endDetached) {
          endVal = snappedVal;
        }
        updatePositions();
      } else if (activeMarker === 'end') {
        if (snappedVal !== endVal || !endDetached) {
          endDetached = true;
          endVal = snappedVal;
          updatePositions();
        }
      }
    }

    function endDrag(evt) {
      if (!activeMarker) return;
      const el = activeMarker === 'start' ? startMarker : endMarker;
      el.classList.remove('dragging');
      if (el.hasPointerCapture(evt.pointerId)) {
        el.releasePointerCapture(evt.pointerId);
      }
      activeMarker = null;
    }

    // Practice Mode Logic
    function generateQuestions() {
      const list = [];
      while (list.length < TOTAL_QUESTIONS) {
        const s = Math.floor(Math.random() * 19) - 9; // -9 to 9
        const e = Math.floor(Math.random() * 21) - 10; // -10 to 10
        const diff = e - s;
        const prev = list[list.length - 1];
        const isDuplicateOfPrev = prev && prev.start === s && prev.diff === diff;

        if (diff !== 0 && (s < 0 || e < 0) && !isDuplicateOfPrev) {
          list.push({ start: s, diff: diff, answer: e });
        }
      }
      return list;
    }

    function loadPracticeQuestion() {
      isTransitioning = false;
      const q = questions[currentQuestionIndex];
      const qNum = currentQuestionIndex + 1;

      progressLabel.textContent = `Question ${qNum} of ${TOTAL_QUESTIONS}`;
      progressFill.style.width = `${(currentQuestionIndex / TOTAL_QUESTIONS) * 100}%`;
      qBadge.textContent = `Q${qNum}`;

      renderEquation(q.start, q.diff);
      triggerNewQuestionAnimation();

      resetDots();

      answerInput.value = '';
      answerInput.disabled = false;
      checkBtn.disabled = false;
      feedbackMsg.textContent = '';
      feedbackMsg.className = 'feedback-msg';
      answerInput.focus();
    }

    function startPractice() {
      isPracticeMode = true;
      questions = generateQuestions();
      currentQuestionIndex = 0;

      startPracticeBtn.style.display = 'none';
      progressWrapper.classList.add('active');
      qBadge.classList.add('active');
      practiceControls.classList.add('active');

      loadPracticeQuestion();
    }

    function exitPractice() {
      isPracticeMode = false;
      isTransitioning = false;

      startPracticeBtn.style.display = 'inline-block';
      progressWrapper.classList.remove('active');
      qBadge.classList.remove('active');
      equationPill.classList.remove('solved', 'new-question');
      practiceControls.classList.remove('active');

      resetDots();
    }

    function checkAnswer() {
      if (!isPracticeMode || isTransitioning) return;

      const userVal = parseInt(answerInput.value, 10);
      if (isNaN(userVal)) {
        feedbackMsg.textContent = 'Enter a number';
        feedbackMsg.className = 'feedback-msg wrong';
        return;
      }

      const currentQ = questions[currentQuestionIndex];
      if (userVal === currentQ.answer) {
        isTransitioning = true;
        feedbackMsg.textContent = 'Correct! Next up...';
        feedbackMsg.className = 'feedback-msg correct';
        progressFill.style.width = `${((currentQuestionIndex + 1) / TOTAL_QUESTIONS) * 100}%`;

        // Briefly highlight the solved equation before transitioning
        equationPill.classList.remove('new-question');
        equationPill.classList.add('solved');
        renderEquation(currentQ.start, currentQ.diff, currentQ.answer);

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < TOTAL_QUESTIONS) {
            loadPracticeQuestion();
          } else {
            equationPill.classList.remove('solved');
            progressLabel.textContent = 'Completed 10 of 10!';
            qBadge.textContent = 'DONE';
            equationPill.innerHTML = `<span class="eq-correct-ans">10 / 10 Complete!</span>`;
            answerInput.disabled = true;
            checkBtn.disabled = true;
            feedbackMsg.textContent = '';
          }
        }, 1100);
      } else {
        feedbackMsg.textContent = 'Try again';
        feedbackMsg.className = 'feedback-msg wrong';
        answerInput.select();
      }
    }

    // Event Listeners
    startMarker.addEventListener('pointerdown', (e) => startDrag('start', e));
    endMarker.addEventListener('pointerdown', (e) => startDrag('end', e));
    window.addEventListener('pointermove', onDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    resetBtn.addEventListener('click', resetDots);
    startPracticeBtn.addEventListener('click', startPractice);
    exitPracticeBtn.addEventListener('click', exitPractice);
    checkBtn.addEventListener('click', checkAnswer);

    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    // Initialize
    drawAxis();
    updatePositions();
  </script>
</body>
</html>
